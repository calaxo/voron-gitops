[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "voron-mcp"
version = "0.1.0"
description = "MCP server to drive a Klipper 3D printer (Voron 2.4 + tool changer) through Moonraker, with a safety layer"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "mcp>=1.20,<2",
  "httpx>=0.27",
  "websockets>=13",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21"]

[project.scripts]
voron-mcp = "voron_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/voron_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
