# Proxy frontal du stack : Mainsail (statique) + Moonraker (API / websocket)
# sur un seul port, comme le fait Traefik dans prind.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream mainsail {
    server mainsail:80;
}

upstream moonraker {
    server moonraker:7125;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Réseau local uniquement.
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    allow 127.0.0.0/8;
    allow 169.254.0.0/16;
    allow ::1;
    allow fe80::/10;
    allow fd00::/8;
    deny all;

    client_max_body_size 0;     # gros G-code
    proxy_request_buffering off;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://mainsail;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        proxy_pass http://mainsail;
    }

    location /websocket {
        proxy_pass http://moonraker/websocket;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
    }

    location ~ ^/(printer|api|access|machine|server)/ {
        proxy_pass http://moonraker$request_uri;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # TODO(camera) : décommenter quand stacks/camera est actif (ustreamer sur l'hôte).
    #location /webcam/ {
    #    proxy_pass http://host.docker.internal:8080/;
    #    proxy_buffering off;
    #}
}
