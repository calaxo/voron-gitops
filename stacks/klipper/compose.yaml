# =============================================================================
# Stack « klipper » : Klipper + Moonraker + Mainsail (images prind) + proxy nginx
# Déployé par Komodo depuis ce dépôt (run_directory = stacks/klipper).
# =============================================================================
# Versions FIGÉES (GitOps) : tag + digest. Mise à jour = commit + redéploiement.
#
# Klipper : l'hôte DOIT tourner la même version que le firmware des MCU (commit 0cee841).
#   prind publie une image par « git describe » amont : v0.13.0-820-g0cee841e3
#   = commit 0cee841e3. Tags : https://hub.docker.com/r/mkuf/klipper/tags
#   Après un reflash des MCU sur un autre commit, changer CE tag (et le digest).
#   Repli si le tag n'existe pas : construire depuis prind avec
#     build: { context: https://github.com/mkuf/prind.git#main:docker/klipper,
#              target: run, args: { VERSION: <commit> } }
# =============================================================================

name: klipper

services:
  klipper:
    image: mkuf/klipper:v0.13.0-820-g0cee841e3@sha256:d2e820079bd743d62714f79fa297ab31b4345f6be60033f2774bded229503700
    restart: unless-stopped
    # Réseau de l'HÔTE : le bus CAN (socket SocketCAN can0) n'existe que dans le
    # namespace réseau de l'hôte. Pas besoin de privileged ni de /dev pour le CAN.
    network_mode: host
    command:
      - -I
      - printer_data/run/klipper.tty
      - -a
      - printer_data/run/klipper.sock
      - printer_data/config/printer.cfg
      - -l
      - printer_data/logs/klippy.log
    environment:
      TZ: ${TZ:-Etc/UTC}
    volumes:
      # Config Klipper en LECTURE SEULE : git est la source de vérité (SAVE_CONFIG désactivé de fait).
      - ../../config/klipper:/opt/printer_data/config:ro
      # Valeurs propres à la machine (UUID CAN) HORS du clone git, pour survivre aux
      # re-clones Komodo : <LOCAL_CONFIG_DIR>/mcu.cfg (modèle : config/klipper/local/mcu.cfg.example).
      - ${LOCAL_CONFIG_DIR:-/etc/voron-gitops/klipper-local}:/opt/printer_data/config/local:ro
      - run:/opt/printer_data/run
      - gcodes:/opt/printer_data/gcodes
      - logs:/opt/printer_data/logs
      # Seulement si un MCU USB/série est ajouté un jour (pas utile en CAN) :
      # - /dev/serial:/dev/serial
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  moonraker:
    image: mkuf/moonraker:v0.11.0-4-gb559b9a@sha256:d51e5b827b54fee81f60ce59932862f803d3f8c4c6cd4394166da7f93710caea
    restart: unless-stopped
    depends_on:
      - klipper
    command: ["-d", "/opt/printer_data", "-c", "/opt/moonraker-config/moonraker.conf"]
    environment:
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - ../../config/moonraker:/opt/moonraker-config:ro
      # Même dossier que Klipper : Mainsail affiche les .cfg (lecture seule).
      - ../../config/klipper:/opt/printer_data/config:ro
      - run:/opt/printer_data/run
      - gcodes:/opt/printer_data/gcodes
      - logs:/opt/printer_data/logs
      - moonraker-db:/opt/printer_data/database
      # Moonraker attend ces chemins de Klipper (vides suffisent), comme dans prind.
      - /dev/null:/opt/klipper/config/null
      - /dev/null:/opt/klipper/docs/null
    expose:
      - "7125"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  mainsail:
    image: ghcr.io/mainsail-crew/mainsail:v2.19.0@sha256:adcadcdb6f9f6ede1f347ca4ac5f469dcc07f3677d46f8ffcd23696c66681893
    restart: unless-stopped
    expose:
      - "80"

  proxy:
    image: nginx:1.30-alpine
    restart: unless-stopped
    depends_on:
      - mainsail
      - moonraker
    ports:
      # Port d'accès à Mainsail (LAN uniquement, filtré dans nginx.conf).
      - "${MAINSAIL_BIND:-0.0.0.0}:${MAINSAIL_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  # Socket klippy partagé Klipper ↔ Moonraker : en RAM, comme dans prind.
  run:
    driver_opts:
      type: tmpfs
      device: tmpfs
  gcodes:
  logs:
  moonraker-db:
