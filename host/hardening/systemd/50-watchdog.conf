# /etc/systemd/system.conf.d/50-watchdog.conf — installé par host/hardening/harden.sh
# Chien de garde matériel (iTCO du chipset Intel) : si le noyau/systemd se fige,
# la carte mère redémarre seule au bout de 60 s. Utile car l'hôte est souvent
# sans personne à côté ; une impression en cours est de toute façon perdue si
# l'hôte est figé. Aucun effet si /dev/watchdog est absent.
[Manager]
RuntimeWatchdogSec=60s
RebootWatchdogSec=5min
