# Komodo Periphery (agent) en conteneur — à poser dans /srv/komodo/ sur l hôte.
# Lancer : cd /srv/komodo && docker compose -p komodo up -d
services:
  periphery:
    image: ghcr.io/moghtech/komodo-periphery:2.3.3@sha256:fa3f1a641a265216066676950d5eecdf506955a7bafe2f01996135ae93115cd5
    labels:
      komodo.skip: # Prevent Komodo from stopping with StopAllContainers
    restart: unless-stopped
    env_file: ./compose.env
    ports:
      - 8120:8120
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/proc
      # Racine de l'agent, MÊME chemin dedans et dehors (Docker résout les bind
      # mounts des stacks sur l'HÔTE). Chemin écrit en dur : PERIPHERY_ROOT_DIRECTORY
      # vit dans compose.env, qui va au conteneur mais n'interpole PAS ce fichier
      # (l'ancienne ligne ${PERIPHERY_ROOT_DIRECTORY:-/etc/komodo} montait /etc/komodo :
      # clones invisibles pour l'hôte, « read-only file system » au démarrage).
      - /srv/komodo:/srv/komodo
      - keys:/config/keys

volumes:
  keys:
