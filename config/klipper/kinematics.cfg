# =============================================================================
# Cinématique CoreXY + 4 moteurs Z (Voron 2.4)
# =============================================================================
# Câblage Voron sur Octopus Pro : MOTOR_0..MOTOR_5 ; MOTOR_6/7 libres, non déclarés.
#   stepper_x = MOTOR_0 = B (arrière gauche) ; stepper_y = MOTOR_1 = A (arrière droit)
# Unités Z : rotation_distance 40 + gear_ratio 80:16 → 1 tour moteur = 8 mm de portique.
# Sens Z (constaté portique entier) : Z1 et Z3 inversés → sens positif = le portique MONTE
# sur les 4 coins.

[printer]
kinematics: corexy
max_velocity: 300
# Limites mesurées (TEST_SPEED) : aucun pas perdu jusqu'à 500 mm/s / 15000 mm/s²,
# décrochage à 600 / 20000 → limite de travail 400 / 10000.
# MAIS l'input shaper recommande ~2000 mm/s² sur Y tant que l'outil n'est tenu que par
# les pions (aimants N52 absents) → on reste à 2000. Cube validé à 300 mm/s / 6000 mm/s²
# (via SET_VELOCITY_LIMIT). À relever après aimants N52 + nouveau SHAPER_CALIBRATE.
max_accel: 2000
max_z_velocity: 5
max_z_accel: 50

[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
microsteps: 16
full_steps_per_rotation: 200
# Poulies A/B 16 dents (vérifié : 100 mm demandés = 80 mm réels avec 40), lockées → 32.
rotation_distance: 32
# Fins de course Hall au fond à droite (X max, Y max). Polarités OPPOSÉES, volontairement
# (aimants collés de côté) : X activé = pin HAUTE → ^PG6.
endstop_pin: ^PG6
# Bord gauche : position_min élargie à 3 (bord gauche du plateau ≈ 14,8 avant réalignement).
position_min: 3
position_endstop: 350
position_max: 350
homing_speed: 15
second_homing_speed: 3
homing_retract_dist: 5
homing_positive_dir: true

[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 32   # idem X : poulies 16 dents
# Y activé = pin BASSE → ^!PG9 (aimant collé dans l'autre sens que X, voulu).
endstop_pin: ^!PG9
# Butée physique avant ≈ -0,85 (crans sautés au-delà) → -0,5. Le dock est à Y≈-0,24.
position_min: -0.5
position_endstop: 350
position_max: 350
homing_speed: 15
second_homing_speed: 3
homing_retract_dist: 5
homing_positive_dir: true

# -----------------------------------------------------------------------------
# Z — PAS DE FIN DE COURSE Z POUR L'INSTANT.
# Le homing Z viendra avec une sonde OptoTap (voir probe.cfg). En attendant,
# homing.cfg refuse G28 Z et la hauteur est posée à la main (SET_Z_MANUAL).
# endstop_pin = STOP_3 (PG11, libre) en simple bouche-trou : Klipper l'exige,
# il n'est jamais utilisé (homing_override intercepte G28).
# TODO(OptoTap) : endstop_pin: probe:z_virtual_endstop, supprimer position_endstop.
# -----------------------------------------------------------------------------
[stepper_z]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 40
gear_ratio: 80:16
endstop_pin: ^PG11
position_endstop: 0
position_min: -5
# Z max réel mesuré ≈ 333. 325 laisse de la marge ET couvre les séquences de dock
# (Z 302,9 max). À vérifier une fois la sonde en place.
position_max: 325
homing_speed: 5

[stepper_z1]
step_pin: PE2
dir_pin: !PE3
enable_pin: !PD4
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 40
gear_ratio: 80:16

[stepper_z2]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 40
gear_ratio: 80:16

[stepper_z3]
step_pin: PC13
dir_pin: !PF0
enable_pin: !PF1
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 40
gear_ratio: 80:16

# TODO(OptoTap) : [quad_gantry_level] une fois la sonde opérationnelle.
