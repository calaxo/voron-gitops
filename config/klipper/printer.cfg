# =============================================================================
# Voron 2.4 350 + StealthChanger — configuration Klipper modulaire
# =============================================================================
# Carte principale : BTT Octopus Pro H723 (TMC5160T Pro en SPI) flashée en pont USB-CAN
# Tête           : StealthBurner + Clockwork 2 + Phaetus Rapido Plus 2 HF (PT1000)
#                  sur BTT EBB SB2209 CAN (STM32G0B1)
# Bus CAN        : 1 Mbit/s, txqueuelen 128 (voir host/systemd/network/)
# Version Klipper des MCU : commit 0cee841 — l'image hôte DOIT correspondre
#                  (stacks/klipper/compose.yaml, KLIPPER_TAG).
#
# GitOps : ce dossier est monté en LECTURE SEULE dans les conteneurs.
#   → SAVE_CONFIG ne peut pas écrire : recopier les résultats (PID, shaper…)
#     dans le fichier concerné, puis commit + redéploiement Komodo.
#   → Aucune valeur propre à l'hôte ici : UUID CAN dans local/mcu.cfg (gitignoré).
# =============================================================================

