# =============================================================================
# Chauffes et sondes de sécurité
# =============================================================================

[heater_bed]
# Tapis 750 W secteur via SSR (commande BED_OUT = PA1), fusible thermique 128 °C en série.
# Thermistance du tapis sur TB (PF3), EPCOS 100K (≈122,7 kΩ à ~22 °C).
# max_power 0.6 = valeur Voron pour un 350.
# PID calibré à 60 °C (PID_CALIBRATE HEATER=heater_bed TARGET=60).
heater_pin: PA1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PF3
max_power: 0.6
min_temp: 0
max_temp: 100
control: pid
pid_Kp: 29.375
pid_Ki: 1.106
pid_Kd: 194.978

[extruder]
# Phaetus Rapido Plus 2 HF, sonde PT1000 lue par le MAX31865 de l'EBB (2 fils).
heater_pin: ebb:PB13
max_power: 1.0
sensor_type: MAX31865
sensor_pin: ebb:PA4
spi_bus: spi1
rtd_nominal_r: 1000
rtd_reference_r: 4300
rtd_num_of_wires: 2
control: pid
pid_Kp: 19.299
pid_Ki: 5.146
pid_Kd: 18.094
min_temp: 0
max_temp: 280
min_extrude_temp: 180

# Sonde NTC 100K (fournie avec l'EBB) collée sur le radiateur du Rapido, port TH0.
# max_temp = SÉCURITÉ : au-delà, Klipper passe en arrêt (« ADC out of range ») et coupe
# tout — protège contre un ventilo hotend HS / heat creep.
[temperature_sensor radiateur_hotend]
sensor_type: Generic 3950
sensor_pin: ebb:PA3
min_temp: 0
max_temp: 65

[verify_heater extruder]
# Valeurs par défaut Klipper (rappel explicite)
max_error: 120
check_gain_time: 20
hysteresis: 5
heating_gain: 2

[verify_heater heater_bed]
# Plateau 350 lent à chauffer : marge sur le temps de gain.
max_error: 120
check_gain_time: 90
hysteresis: 5
heating_gain: 2
