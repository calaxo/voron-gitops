# =============================================================================
# Input shaper — SHAPER_CALIBRATE (ADXL EBB, axes_map z,y,x)
# =============================================================================
# X : pic propre ~50 Hz.
# Y : pic ~27 Hz + composante Z 30-45 Hz (la tête bascule en Y : l'outil n'est tenu
#     que par les pions, sans aimants N52) → Y limite l'accélération à ~2000 mm/s².
# À REFAIRE après pose des aimants N52 (voir docs/calibration-history.md).
# SAVE_CONFIG ne peut pas écrire (config en lecture seule) : recopier ici.

[input_shaper]
shaper_type_x: 3hump_ei
shaper_freq_x: 97.2
shaper_type_y: 3hump_ei
shaper_freq_y: 56.0
