# =============================================================================
# Ventilateurs
# =============================================================================
# Ventilos de tête 2 fils, câblés comme la doc BTT SB2209 (cavalier V_FAN1/2 selon la
# tension des ventilos).
# ATTENTION (constaté) : turbine 5015 (pièce) = PA1, axial 4010 (hotend) = PA0,
# soit l'INVERSE du fichier d'exemple BTT.

[fan]
# Ventilateur pièce (turbine 5015)
pin: ebb:PA1

[heater_fan hotend_fan]
# Axial 4010 du radiateur
pin: ebb:PA0
heater: extruder
heater_temp: 50.0

# Ventilateurs de baie électronique : 2× 6020 24 V sur FAN0 (PA8) et FAN1 (PE5),
# cavalier de tension sur 24 V. Pilotés automatiquement : tournent dès qu'un moteur
# est activé ou qu'une chauffe est active, puis s'arrêtent après idle_timeout.
[controller_fan baie_fan0]
pin: PA8
fan_speed: 1.0
idle_speed: 0.5
idle_timeout: 60
stepper: stepper_x, stepper_y, stepper_z, stepper_z1, stepper_z2, stepper_z3
heater: heater_bed, extruder

[controller_fan baie_fan1]
pin: PE5
fan_speed: 1.0
idle_speed: 0.5
idle_timeout: 60
stepper: stepper_x, stepper_y, stepper_z, stepper_z1, stepper_z2, stepper_z3
heater: heater_bed, extruder
