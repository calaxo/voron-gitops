# =============================================================================
# Macros d'impression, filament et test
# =============================================================================
# Hypothèses tant qu'il n'y a pas de homing Z (OptoTap à venir) :
#   - Z doit avoir été posé à la main (SET_Z_MANUAL) avant PRINT_START ;
#   - PRINT_END ne coupe PAS les moteurs pour conserver la hauteur Z.
# Slicer (start G-code) :
#   PRINT_START BED=[first_layer_bed_temperature] EXTRUDER=[first_layer_temperature] SOAK=0
# Slicer (end G-code) :
#   PRINT_END
# =============================================================================

[gcode_macro PRINT_START]
description: Chauffe, (heat-soak), purge. Params BED EXTRUDER SOAK(min) PURGE(0/1)
variable_purge_x0: 20        # début de la ligne de purge (bord gauche plateau ≈ 14,8)
variable_purge_x1: 120
variable_purge_y: 5          # avant du plateau (zone de dock seulement au-dessus de Z≈130)
variable_purge_z: 0.3
variable_purge_e: 15         # mm de filament sur la ligne
gcode:
    {% set bed = params.BED|default(60)|float %}
    {% set hotend = params.EXTRUDER|default(215)|float %}
    {% set soak = params.SOAK|default(0)|int %}
    {% set purge = params.PURGE|default(1)|int %}
    {% set th = printer.toolhead %}

    CLEAR_PAUSE
    STATUS_HEATING
    G90
    M83

    # --- Référencement ---
    {% if 'x' not in th.homed_axes or 'y' not in th.homed_axes %}
      G28 X Y
    {% endif %}
    {% if 'z' not in th.homed_axes %}
      {action_raise_error("Z non référencé : poser la hauteur avec SET_Z_MANUAL Z=<mm> (pas de homing Z avant l'OptoTap).")}
    {% endif %}
    _TC_CHECK_TOOL_MOUNTED

    # --- Plateau (+ heat-soak optionnel) ---
    M140 S{bed}
    G1 Z{[th.position.z, 10]|max} F600
    G1 X175 Y175 F6000
    M190 S{bed}
    {% if soak > 0 %}
      RESPOND TYPE=echo MSG="Heat-soak {soak} min"
      {% for minute in range(soak) %}
        G4 P60000
        RESPOND TYPE=echo MSG="Heat-soak : {minute + 1}/{soak} min"
      {% endfor %}
    {% endif %}

    # --- Buse ---
    M104 S150                       # préchauffe sans suinter pendant l'approche
    G1 X{purge_x0} Y{purge_y} F6000
    M109 S{hotend}

    # --- Ligne de purge ---
    {% if purge %}
      G1 Z{purge_z} F600
      G1 X{purge_x1} E{purge_e} F1500
      G1 X{purge_x1 + 10} F6000     # essuyage en sortie de ligne
      G1 Z2 F600
    {% endif %}

    M106 S0                         # ventilo pièce : géré par le slicer (100 % dès couche 2-3)
    STATUS_PRINTING

[gcode_macro PRINT_END]
description: Fin d'impression : rétraction, dégagement, parking, chauffes coupées
gcode:
    {% set th = printer.toolhead %}
    {% set z_safe = [th.position.z + 10, th.axis_maximum.z - 5]|min %}
    M400
    G91
    {% if printer.extruder.can_extrude %}
      G1 E-2 F2400
    {% endif %}
    G90
    G1 Z{z_safe} F600
    # Parking à l'arrière (Y 345), loin de la zone de dock (Y < 67,5 au-dessus de Z≈130).
    G1 X175 Y345 F6000
    TURN_OFF_HEATERS
    M107
    # Pas de M84 : on garde la hauteur Z posée à la main (idle_timeout coupera plus tard).
    STATUS_READY

# -----------------------------------------------------------------------------
# Filament (CW2 + Rapido HF)
# -----------------------------------------------------------------------------
[gcode_macro LOAD_FILAMENT]
description: Charge le filament. Params TEMP (chauffe si donné) LENGTH SPEED
gcode:
    {% set length = params.LENGTH|default(60)|float %}
    {% set speed = params.SPEED|default(5)|float %}
    {% if 'TEMP' in params %}
      M109 S{params.TEMP|float}
    {% endif %}
    {% if not printer.extruder.can_extrude %}
      {action_raise_error("Buse trop froide (< min_extrude_temp) : LOAD_FILAMENT TEMP=215")}
    {% endif %}
    SAVE_GCODE_STATE NAME=load_state
    M83
    G1 E{length - 15} F{speed * 60 * 2}   # avance rapide jusqu'à la zone chaude
    G1 E15 F{speed * 60 / 2}              # purge lente
    M400
    RESTORE_GCODE_STATE NAME=load_state

[gcode_macro UNLOAD_FILAMENT]
description: Décharge le filament (pointe formée). Params TEMP LENGTH
gcode:
    {% set length = params.LENGTH|default(70)|float %}
    {% if 'TEMP' in params %}
      M109 S{params.TEMP|float}
    {% endif %}
    {% if not printer.extruder.can_extrude %}
      {action_raise_error("Buse trop froide (< min_extrude_temp) : UNLOAD_FILAMENT TEMP=215")}
    {% endif %}
    SAVE_GCODE_STATE NAME=unload_state
    M83
    G1 E5 F300             # ramollit la pointe
    G1 E-15 F3000          # arrachage rapide (pointe fine)
    G4 P1000
    G1 E-{length} F1800
    M400
    RESTORE_GCODE_STATE NAME=unload_state

# -----------------------------------------------------------------------------
# TEST_SPEED (inspiré de la macro d'Ellis) — détection de pas perdus en XY.
# Compare GET_POSITION (mcu) avant/après : un écart > quelques micropas = pas perdus.
# Résultats mesurés : OK jusqu'à 500 mm/s / 15000 mm/s², décrochage à 600 / 20000.
# Ne bouge PAS en Z (Z peut ne pas être référencé) : vérifier que la tête est dégagée
# et hors zone de dock (Y > 67,5 si Z > 130).
# -----------------------------------------------------------------------------
[gcode_macro TEST_SPEED]
description: TEST_SPEED SPEED=mm/s ACCEL=mm/s² ITERATIONS=n BOUND=mm SMALLPATTERN=mm
gcode:
    {% set speed = params.SPEED|default(printer.configfile.settings.printer.max_velocity)|float %}
    {% set accel = params.ACCEL|default(printer.configfile.settings.printer.max_accel)|float %}
    {% set iterations = params.ITERATIONS|default(5)|int %}
    {% set bound = params.BOUND|default(20)|float %}
    {% set smallpatternsize = params.SMALLPATTERN|default(20)|float %}
    {% set th = printer.toolhead %}
    {% set x_min = th.axis_minimum.x + bound %}
    {% set x_max = th.axis_maximum.x - bound %}
    {% set y_min = [th.axis_minimum.y + bound, 70]|max %}
    {% set y_max = th.axis_maximum.y - bound %}
    {% set x_c = (th.axis_minimum.x + th.axis_maximum.x) / 2 %}
    {% set y_c = (y_min + y_max) / 2 %}
    {% set sp_x0 = x_c - smallpatternsize / 2 %}
    {% set sp_x1 = x_c + smallpatternsize / 2 %}
    {% set sp_y0 = y_c - smallpatternsize / 2 %}
    {% set sp_y1 = y_c + smallpatternsize / 2 %}
    {% set old_accel = th.max_accel %}
    {% set old_mcr = th.minimum_cruise_ratio %}
    {% set old_scv = th.square_corner_velocity %}

    {% if th.position.z > 130 and th.position.y < 67.5 %}
      {action_raise_error("Tête dans la zone de dock (Y<67,5, Z>130) : dégager d'abord.")}
    {% endif %}

    RESPOND TYPE=echo MSG="TEST_SPEED {speed} mm/s, {accel} mm/s², {iterations} itérations"
    G90
    G28 X Y
    G1 X{th.axis_maximum.x - 1} Y{th.axis_maximum.y - 1} F{30 * 60}
    M400
    GET_POSITION

    SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel} MINIMUM_CRUISE_RATIO=0
    {% for i in range(iterations) %}
      # Diagonales + périmètre (grand motif)
      G1 X{x_min} Y{y_min} F{speed * 60}
      G1 X{x_max} Y{y_max} F{speed * 60}
      G1 X{x_min} Y{y_min} F{speed * 60}
      G1 X{x_max} Y{y_min} F{speed * 60}
      G1 X{x_min} Y{y_max} F{speed * 60}
      G1 X{x_max} Y{y_min} F{speed * 60}
      G1 X{x_min} Y{y_min} F{speed * 60}
      G1 X{x_min} Y{y_max} F{speed * 60}
      G1 X{x_max} Y{y_max} F{speed * 60}
      G1 X{x_max} Y{y_min} F{speed * 60}
      # Petit motif au centre
      G1 X{sp_x0} Y{sp_y0} F{speed * 60}
      G1 X{sp_x1} Y{sp_y1} F{speed * 60}
      G1 X{sp_x0} Y{sp_y1} F{speed * 60}
      G1 X{sp_x1} Y{sp_y0} F{speed * 60}
      G1 X{sp_x0} Y{sp_y0} F{speed * 60}
    {% endfor %}
    SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={old_accel} MINIMUM_CRUISE_RATIO={old_mcr} SQUARE_CORNER_VELOCITY={old_scv}

    # Retour près des fins de course puis re-homing : comparer les deux GET_POSITION.
    G1 X{th.axis_maximum.x - 1} Y{th.axis_maximum.y - 1} F{30 * 60}
    M400
    G28 X Y
    G1 X{th.axis_maximum.x - 1} Y{th.axis_maximum.y - 1} F{30 * 60}
    M400
    GET_POSITION
    RESPOND TYPE=echo MSG="Comparer les 'mcu:' des deux GET_POSITION (écart de quelques micropas = OK)"
