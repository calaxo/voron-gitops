# Drivers TMC5160T Pro (Octopus Pro, SPI matériel spi1 partagé avec l'écran Mini12864).
# spi_speed 500 kHz : même vitesse que l'écran sur le bus partagé (valeur validée).
# Le TMC2209 de l'extrudeur est dans extruder.cfg.

[tmc5160 stepper_x]
cs_pin: PC4
spi_bus: spi1
spi_speed: 500000
# 0,8 → 1,2 A (moteurs 17HS19 2 A) après un décalage de couche sur un Benchy.
# homing.cfg baisse temporairement à 0,6 A pendant le homing.
run_current: 1.2
sense_resistor: 0.075
interpolate: True
stealthchop_threshold: 0

[tmc5160 stepper_y]
cs_pin: PD11
spi_bus: spi1
spi_speed: 500000
run_current: 1.2   # idem X
sense_resistor: 0.075
interpolate: True
stealthchop_threshold: 0

[tmc5160 stepper_z]
cs_pin: PC6
spi_bus: spi1
spi_speed: 500000
run_current: 0.8
sense_resistor: 0.075
interpolate: True
stealthchop_threshold: 0

[tmc5160 stepper_z1]
cs_pin: PE1
spi_bus: spi1
spi_speed: 500000
run_current: 0.8
sense_resistor: 0.075
interpolate: True
stealthchop_threshold: 0

[tmc5160 stepper_z2]
cs_pin: PF2
spi_bus: spi1
spi_speed: 500000
run_current: 0.8
sense_resistor: 0.075
interpolate: True
stealthchop_threshold: 0

[tmc5160 stepper_z3]
cs_pin: PE4
spi_bus: spi1
spi_speed: 500000
run_current: 0.8
sense_resistor: 0.075
interpolate: True
stealthchop_threshold: 0
