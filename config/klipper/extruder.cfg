# =============================================================================
# Extrudeur Clockwork 2 sur EBB SB2209 (partie mouvement)
# La partie chauffe / sonde / PID de [extruder] est dans heaters.cfg
# (Klipper fusionne les sections du même nom).
# =============================================================================

[extruder]
step_pin: ebb:PD0
dir_pin: ebb:PD1
enable_pin: !ebb:PD2
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 22.6789511   # valeur CW2 de référence (à affiner par mesure des 100 mm)
gear_ratio: 50:10
nozzle_diameter: 0.400
filament_diameter: 1.750
# Pressure advance : test en lignes 0 → 0,07, 9e ligne retenue (eSUN PLA+ à 215 °C).
pressure_advance: 0.040
max_extrude_only_distance: 120   # LOAD/UNLOAD_FILAMENT
max_extrude_cross_section: 5     # ligne de purge un peu épaisse

[tmc2209 extruder]
uart_pin: ebb:PA15
run_current: 0.5
stealthchop_threshold: 999999

[firmware_retraction]
# eSUN PLA+ validé : 0,8 mm à 35 mm/s (aussi réglé dans le slicer).
retract_length: 0.8
retract_speed: 35
unretract_extra_length: 0
unretract_speed: 35
