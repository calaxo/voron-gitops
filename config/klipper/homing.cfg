# =============================================================================
# Homing — XY UNIQUEMENT pour l'instant
# =============================================================================
# Fins de course : X = ^PG6 (actif haut), Y = ^!PG9 (actif bas) — voir kinematics.cfg.
#
# Z n'a PAS de fin de course : G28 Z est refusé. La hauteur Z se pose à la main
# (nez de buse au papier puis SET_Z_MANUAL Z=<hauteur réelle>), ce qui nécessite
# [force_move] (SET_KINEMATIC_POSITION).
# TODO(OptoTap) : sonde OptoTap → G28 Z au centre du plateau (175,175), puis
#   QUAD_GANTRY_LEVEL ; retirer SET_Z_MANUAL et enable_force_move.
#
# Retiré du banc (gardé ici pour mémoire) : [gcode_button] de lecture des fins de
# course et limites XY « recadrées » élargies pour les essais. QUERY_ENDSTOPS suffit.
# =============================================================================

[force_move]
# Nécessaire tant que Z n'a pas de homing : SET_KINEMATIC_POSITION (SET_Z_MANUAL).
# TODO(OptoTap) : repasser à False.
enable_force_move: True

[homing_override]
axes: xyz
gcode:
    {% set x_cur = printer.configfile.settings['tmc5160 stepper_x'].run_current %}
    {% set y_cur = printer.configfile.settings['tmc5160 stepper_y'].run_current %}
    {% set home_x = 'X' in params or ('Y' not in params and 'Z' not in params) %}
    {% set home_y = 'Y' in params or ('X' not in params and 'Z' not in params) %}

    {% if 'Z' in params and not ('X' in params or 'Y' in params) %}
      {action_raise_error("G28 Z indisponible : pas de fin de course Z (OptoTap à venir). Utiliser SET_Z_MANUAL Z=<hauteur>.")}
    {% endif %}

    # Homing à courant RÉDUIT : si un capteur est raté, le moteur saute des pas
    # sans forcer contre le cadre.
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT=0.6
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT=0.6
    G4 P200
    {% if home_x %}
    G28 X
    {% endif %}
    {% if home_y %}
    G28 Y
    {% endif %}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={x_cur}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={y_cur}

    {% if 'Z' in params or ('X' not in params and 'Y' not in params) %}
      RESPOND TYPE=echo MSG="Homing XY fait. Z NON référencé (pas de fin de course) : SET_Z_MANUAL Z=<hauteur>."
    {% endif %}

[gcode_macro SET_Z_MANUAL]
description: Déclare la hauteur Z courante (mesurée à la main) — temporaire, en attendant l'OptoTap
gcode:
    {% if 'Z' not in params %}
      {action_raise_error("Paramètre Z requis, ex. SET_Z_MANUAL Z=0.1 (buse au papier)")}
    {% endif %}
    {% set z = params.Z|float %}
    {% set zmax = printer.configfile.settings.stepper_z.position_max %}
    {% if z < 0 or z > zmax %}
      {action_raise_error("Z=%.2f hors limites (0..%.1f)" % (z, zmax))}
    {% endif %}
    # SET_HOMED=Z : ne marque QUE Z comme référencé (X/Y gardent leur état).
    SET_KINEMATIC_POSITION Z={z} SET_HOMED=Z
    RESPOND TYPE=echo MSG="Z déclaré à {z} mm (manuel)."

# -----------------------------------------------------------------------------
# Calibrage Z à la feuille AVEC BOUTONS (en attendant l'OptoTap).
# Un clic dans Mainsail : référence X/Y si besoin, centre du plateau, chauffe
# optionnelle, puis l'assistant MANUAL_PROBE de Klipper (fenêtre avec boutons
# -1 / -0.1 / -0.05 / -0.01 / +… et ACCEPTER). À l'acceptation, la hauteur est
# posée à l'épaisseur de la feuille et la buse remonte de 5 mm.
#   CALIBRAGE_FEUILLE                      (à froid)
#   CALIBRAGE_FEUILLE BED=60 EXTRUDER=150  (recommandé : plateau chaud, buse tiède)
# DEPART : hauteur SUPPOSÉE de la buse au lancement quand Z n'est pas référencé.
# Klipper autorise ensuite à descendre jusqu'à -5 : si la buse est plus haut que
# DEPART+5, l'assistant butera avant la feuille → relancer avec DEPART plus grand.
# -----------------------------------------------------------------------------
[gcode_macro CALIBRAGE_FEUILLE]
description: Calibrage Z à la feuille avec boutons. Params BED EXTRUDER (°C, 0 = pas de chauffe) PAPIER (mm) DEPART (mm)
variable_papier: 0.1
gcode:
    {% set bed = params.BED|default(0)|float %}
    {% set ext = params.EXTRUDER|default(0)|float %}
    {% set depart = params.DEPART|default(20)|float %}
    {% set th = printer.toolhead %}
    {% if printer.idle_timeout.state == "Printing" %}
      {action_raise_error("Impression en cours : calibrage refusé.")}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=CALIBRAGE_FEUILLE VARIABLE=papier VALUE={params.PAPIER|default(0.1)|float}
    G90
    {% if 'z' in th.homed_axes %}
      G0 Z{[th.position.z, 5]|max} F600
    {% else %}
      SET_KINEMATIC_POSITION Z={depart} SET_HOMED=Z
      RESPOND TYPE=echo MSG="Z supposé à {depart} mm : descendre par petits pas en regardant la buse."
    {% endif %}
    {% if 'x' not in th.homed_axes or 'y' not in th.homed_axes %}
      G28 X Y
    {% endif %}
    G0 X175 Y175 F6000
    {% if bed > 0 %}
      M190 S{bed}
    {% endif %}
    {% if ext > 0 %}
      M109 S{ext}
    {% endif %}
    MANUAL_PROBE
    RESPOND TYPE=echo MSG="Glisser la feuille sous la buse, descendre avec les boutons jusqu'à un léger frottement, puis ACCEPTER."
    UPDATE_DELAYED_GCODE ID=_CALIBRAGE_FEUILLE_FIN DURATION=0.5

[delayed_gcode _CALIBRAGE_FEUILLE_FIN]
gcode:
    {% set mp = printer.manual_probe %}
    {% if mp.is_active %}
      UPDATE_DELAYED_GCODE ID=_CALIBRAGE_FEUILLE_FIN DURATION=0.5
    {% elif mp.z_position is not none %}
      {% set papier = printer["gcode_macro CALIBRAGE_FEUILLE"].papier %}
      SET_KINEMATIC_POSITION Z={papier} SET_HOMED=Z
      G91
      G0 Z5 F600
      G90
      RESPOND TYPE=echo MSG="Z posé à {papier} mm (feuille) et buse remontée de 5 mm. Prêt à imprimer."
    {% else %}
      RESPOND TYPE=error MSG="Calibrage à la feuille annulé : Z non modifié."
    {% endif %}
