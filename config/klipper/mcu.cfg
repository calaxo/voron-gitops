# MCU : les sections [mcu] / [mcu ebb] (UUID CAN) sont dans local/mcu.cfg (gitignoré).
# Ici : tout ce qui dépend des MCU mais n'identifie pas la machine.

[temperature_sensor octopus]
sensor_type: temperature_mcu

[temperature_sensor ebb]
sensor_type: temperature_mcu
sensor_mcu: ebb

[temperature_sensor hote]
# CPU du mini-PC (lu via /sys dans le conteneur)
sensor_type: temperature_host
