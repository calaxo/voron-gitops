# =============================================================================
# Écran BTT Mini12864 (brochage Voron pour Octopus)
# =============================================================================
# EXP1_3=PE9, EXP1_4=PE10, EXP1_5=PE12, EXP2_5=PB2, EXP2_3=PB1, EXP1_2=PE7, EXP1_6=PE13.
# Bus matériel spi1 PARTAGÉ avec les TMC5160 (MISO EXP2_1 isolé côté écran),
# à 500 kHz comme les drivers.

[display]
lcd_type: uc1701
cs_pin: PE9
a0_pin: PE10
rst_pin: PE12
spi_bus: spi1
spi_speed: 500000
contrast: 63
encoder_pins: ^PB2, ^PB1
click_pin: ^!PE7
menu_timeout: 40

[static_digital_output sd_ecran_cs]
# EXP2_4 = PA4 = CS du lecteur SD de la Mini12864 (même spi1 que les drivers) :
# forcée haute pour que la carte SD ne parle jamais sur le bus.
pins: PA4

[neopixel btt_mini12864]
# EXP1_6 = PE13 : 1 = écran, 2 et 3 = bouton
pin: PE13
chain_count: 3
color_order: RGB
initial_RED: 0.1
initial_GREEN: 0.5
initial_BLUE: 0.0
