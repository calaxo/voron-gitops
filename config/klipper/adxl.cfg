# =============================================================================
# Accéléromètre ADXL345 de l'EBB SB2209 + testeur de résonance
# =============================================================================

[adxl345]
cs_pin: ebb:PB12
spi_bus: spi2_PB2_PB11_PB10
# EBB montée VERTICALE dans le StealthBurner : gravité sur x de la puce,
# mouvement X de la machine sur z de la puce → axes_map z,y,x (vérifié par ACCELEROMETER_QUERY).
axes_map: z,y,x

[resonance_tester]
accel_chip: adxl345
# Point de mesure au centre. Z=20 suppose la hauteur Z posée (SET_Z_MANUAL) tant
# qu'il n'y a pas de homing Z.
probe_points: 175, 175, 20
