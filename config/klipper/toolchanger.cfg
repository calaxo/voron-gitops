# =============================================================================
# StealthChanger — 1 outil (T0) pour l'instant : dépose / prise sur le dock
# =============================================================================
# ⚠ À VÉRIFIER avant toute utilisation automatique : séquences mesurées à la main,
#   Z = hauteur RÉELLE buse/plateau (posée par SET_Z_MANUAL, pas de homing Z).
#   Premiers essais : vitesse réduite (M220 S50), main sur l'arrêt d'urgence.
#   Détail et historique : docs/dock-sequences.md.
#
# Zone interdite (keep-out) : Y -0,5 .. 67,5 au-dessus de Z ≈ 130 (docks à l'avant,
# pas encore d'ombilicaux). On n'y entre QUE par les séquences ci-dessous, toujours
# en arrivant par Y 70.
#
# Pré-requis config : stepper_z.position_max ≥ 302,9 (actuellement 325) et
#                     stepper_y.position_min ≤ -0,24 (actuellement -0,5).
#
# État de l'outil (perdu au redémarrage de Klipper) :
#   -2 = inconnu (au démarrage), -1 = navette vide, 0 = T0 sur la navette.
#   TC_SET_STATE TOOL=0|-1 pour le déclarer après inspection visuelle.
# TODO : passer à klipper-toolchanger (viesturz) quand il y aura plusieurs outils.
# =============================================================================

[gcode_macro _TC_STATE]
variable_tool: -2
gcode:

[gcode_macro _TC_CFG]
description: Coordonnées de dock T0 (mesurées, À VÉRIFIER)
variable_dock_x: 38.8
variable_y_out: 70.0          # sortie / approche, hors keep-out
variable_y_pre: 63.5          # pré-position avant entrée dans le dock
variable_y_mid: 10.0
variable_y_dock: -0.24        # fond du dock
variable_z_dock_high: 300.9   # DOCK : hauteur d'entrée outil monté
variable_z_dock_low: 289.0    # DOCK : hauteur après dépose / PICKUP : hauteur d'entrée navette vide
variable_z_pickup_high: 302.9 # PICKUP : hauteur après prise
variable_keepout_y: 67.5
variable_keepout_z: 130.0
variable_accel: 1000          # accel réduite pendant les séquences
# Brosse : contact du haut à Z 300,4 en X 39,17 Y 10,81 → essuyage 0,25 mm au-dessus.
variable_wipe_enabled: False  # À VÉRIFIER avant d'activer
variable_wipe_x: 39.17
variable_wipe_y: 10.81
variable_wipe_z: 300.65
variable_wipe_stroke: 8.0     # course de part et d'autre de wipe_x (à vérifier)
variable_wipe_passes: 3
gcode:

[gcode_macro TC_SET_STATE]
description: Déclare l'état de la navette après vérification visuelle (TOOL=0 ou TOOL=-1)
gcode:
    {% set t = params.TOOL|int %}
    {% if t not in [0, -1] %}
      {action_raise_error("TOOL doit valoir 0 (T0 monté) ou -1 (navette vide)")}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_TC_STATE VARIABLE=tool VALUE={t}
    RESPOND TYPE=echo MSG="État navette : {t}"

[gcode_macro _TC_CHECK_TOOL_MOUNTED]
gcode:
    {% set t = printer["gcode_macro _TC_STATE"].tool %}
    {% if t == -1 %}
      {action_raise_error("Aucun outil sur la navette : T0 d'abord.")}
    {% elif t == -2 %}
      RESPOND TYPE=echo MSG="État outil inconnu (supposé T0 monté). TC_SET_STATE TOOL=0 pour le confirmer."
    {% endif %}

[gcode_macro _TC_PRECHECK]
gcode:
    {% set c = printer["gcode_macro _TC_CFG"] %}
    {% set th = printer.toolhead %}
    {% if th.homed_axes != "xyz" %}
      {action_raise_error("X, Y et Z doivent être référencés (G28 X Y + SET_Z_MANUAL).")}
    {% endif %}
    {% if th.axis_maximum.z < c.z_pickup_high or th.axis_maximum.z < c.z_dock_high %}
      {action_raise_error("position_max Z trop basse pour les hauteurs de dock.")}
    {% endif %}
    {% if th.axis_minimum.y > c.y_dock %}
      {action_raise_error("position_min Y trop haute pour le fond du dock.")}
    {% endif %}
    {% if th.position.z > c.keepout_z and th.position.y < c.keepout_y %}
      {action_raise_error("Tête déjà dans la zone de dock : position incertaine, dégager à la main.")}
    {% endif %}

[gcode_macro _TC_APPROACH]
description: Amène la tête en (dock_x, y_out, Z) en restant hors keep-out
gcode:
    {% set c = printer["gcode_macro _TC_CFG"] %}
    {% set th = printer.toolhead %}
    {% set z = params.Z|float %}
    G90
    {% if th.position.y < c.y_out %}
      G1 Y{c.y_out} F6000        # sortir de la bande avant à la hauteur actuelle (< keepout_z)
    {% endif %}
    G1 Z{z} F600
    G1 X{c.dock_x} F6000

[gcode_macro TC_DOCK]
description: Dépose T0 sur son dock (séquence mesurée, À VÉRIFIER)
gcode:
    {% set c = printer["gcode_macro _TC_CFG"] %}
    {% set t = printer["gcode_macro _TC_STATE"].tool %}
    {% set old_accel = printer.toolhead.max_accel %}
    {% if t == -1 %}
      {action_raise_error("Navette déjà vide.")}
    {% elif t == -2 %}
      {action_raise_error("État inconnu : vérifier visuellement puis TC_SET_STATE TOOL=0.")}
    {% endif %}
    _TC_PRECHECK
    SAVE_GCODE_STATE NAME=tc_dock
    SET_VELOCITY_LIMIT ACCEL={c.accel}
    M400
    _TC_APPROACH Z={c.z_dock_high}
    G1 Y{c.y_pre} F3000                 # X38.8 Y63.5 Z300.9
    G1 Y{c.y_mid} F{10 * 60}            # Y10 à 10 mm/s
    G1 Y{c.y_dock} F{2 * 60}            # Y-0.24 à 2 mm/s
    G1 Z{c.z_dock_low} F{2 * 60}        # Z289.0 à 2 mm/s (l'outil reste sur le dock)
    G1 Y{c.y_mid} F{2 * 60}             # Y10 à 2 mm/s
    G1 Y{c.y_out} F{20 * 60}            # Y70 à 20 mm/s
    M400
    SET_GCODE_VARIABLE MACRO=_TC_STATE VARIABLE=tool VALUE=-1
    SET_VELOCITY_LIMIT ACCEL={old_accel}
    RESTORE_GCODE_STATE NAME=tc_dock
    RESPOND TYPE=echo MSG="T0 déposé."

[gcode_macro TC_PICKUP]
description: Prend T0 sur son dock (séquence mesurée, À VÉRIFIER)
gcode:
    {% set c = printer["gcode_macro _TC_CFG"] %}
    {% set t = printer["gcode_macro _TC_STATE"].tool %}
    {% set old_accel = printer.toolhead.max_accel %}
    {% if t == 0 %}
      {action_raise_error("T0 déjà monté.")}
    {% elif t == -2 %}
      {action_raise_error("État inconnu : vérifier visuellement puis TC_SET_STATE TOOL=-1.")}
    {% endif %}
    _TC_PRECHECK
    SAVE_GCODE_STATE NAME=tc_pickup
    SET_VELOCITY_LIMIT ACCEL={c.accel}
    M400
    _TC_APPROACH Z={c.z_dock_low}       # X38.8 Y70 Z289.0
    G1 Y{c.y_mid} F{20 * 60}            # Y10 à 20 mm/s
    G1 Y{c.y_dock} F{2 * 60}            # Y-0.24 à 2 mm/s
    G1 Z{c.z_pickup_high} F{2 * 60}     # Z302.9 à 2 mm/s (la navette soulève l'outil)
    G1 Y{c.y_mid} F{2 * 60}             # Y10 à 2 mm/s
    G1 Y{c.y_out} F{20 * 60}            # Y70 à 20 mm/s
    M400
    SET_GCODE_VARIABLE MACRO=_TC_STATE VARIABLE=tool VALUE=0
    SET_VELOCITY_LIMIT ACCEL={old_accel}
    RESTORE_GCODE_STATE NAME=tc_pickup
    RESPOND TYPE=echo MSG="T0 pris."

[gcode_macro T0]
description: Sélectionne T0 (prise sur le dock si la navette est vide)
gcode:
    {% set t = printer["gcode_macro _TC_STATE"].tool %}
    {% if t == 0 %}
      RESPOND TYPE=echo MSG="T0 déjà actif."
    {% elif t == -1 %}
      TC_PICKUP
    {% else %}
      {action_raise_error("État navette inconnu : TC_SET_STATE TOOL=0 ou -1 après vérification.")}
    {% endif %}

[gcode_macro TC_WIPE]
description: Essuyage de la buse sur la brosse près du dock (À VÉRIFIER, désactivé par défaut)
gcode:
    {% set c = printer["gcode_macro _TC_CFG"] %}
    {% if not c.wipe_enabled %}
      {action_raise_error("TC_WIPE désactivé : vérifier les cotes puis variable_wipe_enabled: True (toolchanger.cfg).")}
    {% endif %}
    _TC_CHECK_TOOL_MOUNTED
    _TC_PRECHECK
    SAVE_GCODE_STATE NAME=tc_wipe
    G90
    {% if printer.toolhead.position.y < c.y_out %}
      G1 Y{c.y_out} F6000
    {% endif %}
    G1 Z{c.wipe_z} F600
    G1 X{c.wipe_x} F6000
    G1 Y{c.wipe_y} F{10 * 60}
    {% for i in range(c.wipe_passes) %}
      G1 X{c.wipe_x - c.wipe_stroke} F{50 * 60}
      G1 X{c.wipe_x + c.wipe_stroke} F{50 * 60}
    {% endfor %}
    G1 X{c.wipe_x} F{50 * 60}
    G1 Y{c.y_out} F{20 * 60}
    M400
    RESTORE_GCODE_STATE NAME=tc_wipe
