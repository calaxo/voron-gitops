# =============================================================================
# Sections requises par Moonraker / Mainsail + PAUSE / RESUME / CANCEL_PRINT
# (équivalent minimal du mainsail.cfg officiel, non disponible dans les conteneurs)
# =============================================================================

[virtual_sdcard]
path: /opt/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[pause_resume]

[display_status]

[exclude_object]

[respond]

[gcode_arcs]
resolution: 0.1

[idle_timeout]
# 30 min (au banc : 3600 s pour ne pas perdre le homing pendant les réglages).
timeout: 1800
gcode:
    TURN_OFF_HEATERS
    M84
    STATUS_OFF

[gcode_macro PAUSE]
description: Pause avec remontée Z et parking
rename_existing: PAUSE_BASE
variable_park_x: 175
variable_park_y: 345    # arrière, hors zone de dock (Y < 67,5)
variable_lift_z: 10
variable_e_retract: 1.0
gcode:
    {% if printer.pause_resume.is_paused %}
      RESPOND TYPE=echo MSG="Déjà en pause"
    {% else %}
      {% set th = printer.toolhead %}
      {% set z_safe = [th.position.z + lift_z, th.axis_maximum.z - 5]|min %}
      PAUSE_BASE
      G91
      {% if printer.extruder.can_extrude %}
        G1 E-{e_retract} F2100
      {% endif %}
      G90
      G1 Z{z_safe} F600
      G1 X{park_x} Y{park_y} F6000
    {% endif %}

[gcode_macro RESUME]
description: Reprise après PAUSE
rename_existing: RESUME_BASE
gcode:
    {% set e = printer["gcode_macro PAUSE"].e_retract %}
    {% if printer.extruder.can_extrude %}
      M83
      G1 E{e} F2100
    {% endif %}
    RESUME_BASE VELOCITY={params.VELOCITY|default(100)}

[gcode_macro CANCEL_PRINT]
description: Annule l'impression proprement
rename_existing: CANCEL_PRINT_BASE
gcode:
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
    PRINT_END
    CLEAR_PAUSE
    SDCARD_RESET_FILE
    CANCEL_PRINT_BASE
