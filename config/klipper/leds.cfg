# =============================================================================
# LEDs StealthBurner (3 neopixels RGBW sur l'EBB)
# Ordre de chaîne SB habituel : 1 = logo, 2-3 = buse (à vérifier sur la tête).
# =============================================================================

[neopixel sb_leds]
pin: ebb:PD3
chain_count: 3
color_order: GRBW
initial_RED: 0
initial_GREEN: 0
initial_BLUE: 0
initial_WHITE: 0

[gcode_macro STATUS_OFF]
gcode:
    SET_LED LED=sb_leds RED=0 GREEN=0 BLUE=0 WHITE=0

[gcode_macro STATUS_READY]
gcode:
    SET_LED LED=sb_leds RED=0 GREEN=0.3 BLUE=0 WHITE=0 INDEX=1 TRANSMIT=0
    SET_LED LED=sb_leds RED=0 GREEN=0 BLUE=0 WHITE=0.6 INDEX=2 TRANSMIT=0
    SET_LED LED=sb_leds RED=0 GREEN=0 BLUE=0 WHITE=0.6 INDEX=3

[gcode_macro STATUS_HEATING]
gcode:
    SET_LED LED=sb_leds RED=0.6 GREEN=0.15 BLUE=0 WHITE=0 INDEX=1 TRANSMIT=0
    SET_LED LED=sb_leds RED=0 GREEN=0 BLUE=0 WHITE=0.3 INDEX=2 TRANSMIT=0
    SET_LED LED=sb_leds RED=0 GREEN=0 BLUE=0 WHITE=0.3 INDEX=3

[gcode_macro STATUS_PRINTING]
gcode:
    SET_LED LED=sb_leds RED=0 GREEN=0 BLUE=0.5 WHITE=0 INDEX=1 TRANSMIT=0
    SET_LED LED=sb_leds RED=0 GREEN=0 BLUE=0 WHITE=1.0 INDEX=2 TRANSMIT=0
    SET_LED LED=sb_leds RED=0 GREEN=0 BLUE=0 WHITE=1.0 INDEX=3

[gcode_macro STATUS_ERROR]
gcode:
    SET_LED LED=sb_leds RED=1.0 GREEN=0 BLUE=0 WHITE=0
